---
# Named tools only (PyPI or `name@url`). A directory source is reinstalled by
# converge when its files change, so there is nothing to upgrade here.
- name: "[uv] Show what would be upgraded"
  ansible.builtin.debug:
    msg: "uv tools: {{ _names | join(', ') or '(none upgradable)' }}"
  vars:
    _names: "{{ _pkg_names | reject('match', '^/') | map('regex_replace', '@.*$', '') | list }}"

- name: "[uv] Upgrade named tools"
  ansible.builtin.command:
    argv: "{{ [tenon_platform.uv_bin, 'tool', 'upgrade'] + _names }}"
  vars:
    _names: "{{ _pkg_names | reject('match', '^/') | map('regex_replace', '@.*$', '') | list }}"
  register: _uv_upgrade
  changed_when: "'Nothing to upgrade' not in _uv_upgrade.stdout + _uv_upgrade.stderr"
  when:
    - _pkg_apply | bool
    - _names | length > 0
