---
# Names reach argv, never a shell; a leading `-` would still be read as an
# option, so the shape is checked before any manager sees them.
- name: Validate declared package names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9@_+][A-Za-z0-9@._+/-]*$')
    fail_msg: >-
      '{{ item }}' is not a valid package name. Check the layers'
      packages_baseline and the capabilities' `packages:` mappings.
    quiet: true
  loop: "{{ tenon_packages | dict2items | rejectattr('key', 'eq', 'uv') | map(attribute='value') | flatten }}"

# uv specs are tool install targets (a name, `name@url`, an absolute path), so
# `:` and the rest of a URL are legal; only a leading `-` is not.
- name: Validate declared uv specs
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9/][^\s]*$')
    fail_msg: >-
      '{{ item }}' is not a valid uv spec: a PyPI name, name@url or an
      absolute directory.
    quiet: true
  loop: "{{ tenon_packages.get('uv', []) }}"

# Profile order, so e.g. pacman runs before aur (an AUR package's repo
# dependencies are then already present).
- name: Converge each package manager
  ansible.builtin.include_tasks: "converge/{{ _pkg_mgr }}.yml"
  loop: "{{ tenon_package_managers }}"
  loop_control:
    loop_var: _pkg_mgr
  vars:
    _pkg_names: "{{ tenon_packages.get(_pkg_mgr, []) }}"
  # cask-only machines still need brew.yml for the tap of an `owner/tap/name` cask.
  when: >-
    (tenon_packages.get(_pkg_mgr, []) | length > 0)
    or (_pkg_mgr == 'brew' and tenon_packages.get('cask', []) | length > 0)
