---
# Called by the upgrade role. Each manager previews what it would upgrade and
# upgrades it once `tenon_upgrade_assume_yes` is set.
- name: Upgrade each package manager
  ansible.builtin.include_tasks: "upgrade/{{ _pkg_mgr }}.yml"
  loop: "{{ tenon_package_managers }}"
  loop_control:
    loop_var: _pkg_mgr
  vars:
    _pkg_names: "{{ tenon_packages.get(_pkg_mgr, []) }}"
    _pkg_apply: "{{ (tenon_upgrade_assume_yes | bool) and not ansible_check_mode }}"
  when: tenon_packages.get(_pkg_mgr, []) | length > 0
